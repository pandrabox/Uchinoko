[pytest]
# 既定で **実機(Palworld)を必要とする検査を除外**する(受入条件)。
# 実機まで回したいときはコマンドラインで `-m machine --allow-machine` を明示する
# (-m は後勝ちなので addopts の指定を上書きできる)。
#
# --continue-on-collection-errors: 1モジュールが壊れても残りを回す(無人運転)。
# -x は **絶対に付けないこと**。1件の FAIL で全体が止まってしまう。
addopts = -m "not machine" --tb=short -ra --continue-on-collection-errors
testpaths = .
markers =
    machine: Palworld 実機への接触を伴う(既定で除外)
    slow: 実変換(convert.ps1)を伴う。--allow-convert が要る
filterwarnings =
    ignore::DeprecationWarning
