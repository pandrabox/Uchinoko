# Uchinoko for Palworld — 公開リポジトリ(pandrabox/Uchinoko)用 CIワークフロー
#
# 2026-08-01(dev#573、dev#532 D1の直後の是正): このワークフローは長らく
# C#/WinForms時代(app\DiveToPalworld.cs / app\build_app.ps1 / csc.exeビルド /
# Uchinoko.exe)の前提で書かれていたが、D1(dev#532統合WP)で配布物が
# Python/tkinter版(app_py\、app_py\build.py)へ全面切替され、配布zip直下は
# Uchinoko.bat / README.txt / res\ の3点のみになった(自作PEはゼロ。
# packaging\check_signatures.py の SELF_MADE_PE_COUNT=0がこの前提そのもの)。
# 旧ワークフローが前提にしていた「csc.exeでexeをビルドし、ooz.pyd/python3.dllを
# 取得してmake_dist.ps1でフル配布zipを組み立て、署名候補exeを取り出してハッシュ計算し、
# artifactへupload、タグpush時はGitHub Releaseへ添付する」という一連の手順は、
# 次にこのCIが実際にトリガーされた時点(push/PR/タグpush)で確実に壊れる状態だった
# (本体exeが存在しないため)。dev#573でここを全面書き換えた。
#
# 新方針(オーナー/指揮者裁定、dev#573): このCIの検証内容は
# 「公開リポジトリ単体で成立する軽量な健全性確認」(python構文チェック+軽い
# ユニットテスト)に留める。Blender・Palworld実機・WSB(Windows Sandbox)のような
# 開発機依存は一切要求しない。フル配布物のビルド・SignPath連携・GitHub Release
# 自動作成という「署名対象artifactを前提にした重い経路」は、dev#530
# (SignPath申請凍結、方針Aで署名対象そのものが消えたため)とペアで再設計すべき
# 製品判断であり、本WPの範囲外として意図的に据え置く(公開CIから一旦削除。
# 再設計の要否はフォローアップissueで追跡: dev#636)。
#
# 実行内容:
#   1. python -m compileall app_py -q : 構文エラーがあれば非ゼロで落ちる
#   2. python -m pytest app_py\tests -q : app_py本体のユニットテスト一式
#      (tkウィジェットをモックし実tk窓を開かない設計、dev#532以降の既存資産)
#   3. python -m pytest tests\shipcheck\test_dist_shipped_docs_content.py -v :
#      配布文書(README.txt等)にCLAUDE.mdの絶対禁止事項(Defender除外案内・
#      虚偽の検出解除断定等)が無いかの回帰検査。このファイルは自己完結設計
#      (devtools\sensitive_denylist が無い環境ではowner_handle_leakチェックだけが
#      自動的に無効化され、他の判定は継続する)で、公開ツリー単独でも収集・実行
#      可能なことを確認済み(WP35由来)。実際に配布zipを組み立てて中身を検査する
#      統合テストは、ビルド前提(csc.exe/ooz.pyd/python3.dll)が揃っていない本
#      ワークフローの環境では自動的にskipされる(pyooz/python3.dll取得ステップを
#      本WPで削除したため。テスト自身の設計どおりの挙動であり偽装ではない)。
#
# トリガ方針(WP25/2026-07-31の判断を維持): push(既定ブランチ)・pull_request・
# workflow_dispatchに加え、タグpush(v*)でも同じ軽量ヘルスチェックを走らせる
# (「コミットのたびに緑が見える」目的を保つ。ビルド前提が無いので所要時間も短い)。
# - 既定ブランチは実機確認済み: 公開repo pandrabox/Uchinoko のdefault branchは "main"
# - paths-ignore は pull_request にのみ付与(push側を間引くと「毎回緑が見える」
#   目的を弱めるため)。
name: build

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "manual/**"

permissions:
  contents: read

env:
  # Windowsランナーの既定コードページ(cp932)地雷の予防(CLAUDE.md「言語方針」節、
  # dev#21参照。dev専用 .github\workflows\ci.yml と同じ設定を踏襲)。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  healthcheck:
    name: Public repo health check (python syntax + unit tests)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # actions/checkout はタグではなくコミットSHAで固定する(サプライチェーン改竄耐性、
      # dev#573より前のFIX12/2026-07-31から継続する方針。ビルド前提を伴わない
      # 軽量CIになっても、実行するアクション自体の出自固定は引き続き価値がある)。
      # SHAは `gh api repos/actions/checkout/git/refs/tags/v4.4.0` で実際に解決したもの。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/setup-python もコミットSHAで固定する。SHAは
      # `gh api repos/actions/setup-python/git/refs/tags/v5.6.0` で実際に解決したもの
      # (2026-08-01時点でv5タグが指すコミットと同一)。
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pytest (test-only tool, not shipped in the distributed zip)
        shell: pwsh
        run: |
          python -m pip install --quiet "pytest==9.0.3"
          if ($LASTEXITCODE -ne 0) { Write-Error "pytestのインストールに失敗"; exit 1 }

      # app_py\ 配下の全.pyファイルをコンパイルするだけで構文エラーは検出できる
      # (実行はしない、importの副作用も無い)。
      - name: Python syntax check (app_py)
        shell: pwsh
        run: |
          python -m compileall app_py -q
          if ($LASTEXITCODE -ne 0) { Write-Error "app_py配下にPython構文エラーがある"; exit 1 }

      # app_py本体のユニットテスト一式(dev#532以降の既存資産)。tkウィジェットは
      # モックされ実tk窓は開かない設計のため、GUI無しのCIランナーでも実行できる。
      - name: Run app_py unit tests
        shell: pwsh
        run: |
          python -m pytest app_py\tests -q
          if ($LASTEXITCODE -ne 0) { Write-Error "app_py\testsがFAILした"; exit 1 }

      # 配布文書の禁止内容回帰検査(WP35/2026-07-31由来)。ビルド前提が無い本ワークフロー
      # では、実際に配布zipを組み立てて検査する統合テスト部分は自動的にskipされる
      # (テスト自身の設計。収集0件・import失敗・アサーション失敗のいずれでもpytestは
      # 非ゼロで終了するため、偽の緑にはならない)。
      - name: Run public-repo pytest suite (tests/shipcheck/test_dist_shipped_docs_content.py)
        shell: pwsh
        run: |
          python -m pytest tests\shipcheck\test_dist_shipped_docs_content.py -v
          if ($LASTEXITCODE -ne 0) {
            Write-Error "公開リポジトリのpytestスイートがFAILした(exit=$LASTEXITCODE)。原因はログを直接確認すること。"
            exit 1
          }
          Write-Host "OK: 公開リポジトリのpytestスイート PASS"

# ------------------------------------------------------------------------------------
# フル配布物ビルド・SignPath連携・GitHub Release自動作成について(dev#573で削除)
#
# 旧ワークフローには、タグpush時にビルド済みexeをdraft GitHub Releaseへ添付する
# `release` ジョブと、SignPath連携の雛形(コメントアウト済み `sign` ジョブ)が
# あった。いずれも「csc.exeでビルドした署名候補exeが存在する」ことが大前提の設計
# であり、py版(方針A)には自作PEが一つも存在しない(packaging\check_signatures.py
# のSELF_MADE_PE_COUNT=0がこの前提そのもの)ため、そのままでは移植できない。
#
# 「そもそも何を署名候補artifactとして提出するのか(zipそのものだけで良いのか、
# SHA256SUMS運用は継続するのか)」は製品判断が要り、dev#530(SignPath申請凍結、
# 2026-08-01時点で凍結中)の解除・再開判断とセットで行うのが自然という判断は
# 元issue(dev#573が起票された時点のコメント)から変わっていない。本WPはCIを
# 「今のソースで確実に赤くならない」状態へ戻すことを優先し、この再設計自体は
# フォローアップissue(dev#636)へ切り出した。
#
# 再開する際の入口は、dev#636のコメント列と、このコミット以前のgit履歴に残る
# 旧build.yml(release ジョブ・SignPath雛形の完全な実装例)を参照すること。
# ------------------------------------------------------------------------------------
